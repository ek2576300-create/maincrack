<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Top War Pets — Kraken Chronicles</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#02090d;color:#e9f0ef}body{background:radial-gradient(circle at 50% -7%,rgba(27,139,144,.27),transparent 33%),radial-gradient(circle at 10% 24%,rgba(25,95,103,.17),transparent 26%),linear-gradient(180deg,#031016,#06151a 48%,#02090d)}
.wrap{max-width:1480px;margin:auto;padding:18px 24px 50px}.hero{position:relative;overflow:hidden;min-height:176px;border:1px solid rgba(216,180,93,.36);border-radius:20px;background:radial-gradient(circle at 50% 104%,rgba(221,169,54,.22),transparent 27%),radial-gradient(circle at 50% 0%,rgba(41,163,160,.34),transparent 36%),linear-gradient(90deg,#01080cf9,rgba(5,36,42,.9) 26%,rgba(6,44,50,.94) 50%,rgba(5,36,42,.9) 74%,#01080cf9);box-shadow:0 22px 60px #0007,inset 0 0 65px #0007;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px}.hero:before,.hero:after{content:"";position:absolute;width:430px;height:190px;top:-68px;border:18px solid rgba(30,128,128,.22);border-left-color:transparent;border-bottom-color:transparent;border-radius:50%}.hero:before{left:-125px;transform:rotate(14deg)}.hero:after{right:-125px;transform:scaleX(-1) rotate(14deg)}.hero-kicker{font-size:11px;font-weight:800;letter-spacing:.32em;color:#e7cf8c}.hero h1{margin:6px 0 8px;font:800 clamp(34px,5vw,62px)/.95 Georgia,serif;color:#f4dc91;text-shadow:0 2px #5a3515,0 0 22px #e8be5d2e}.hero-sub{font-size:12px;letter-spacing:.16em;color:#9fc8c5}.hero-actions{position:absolute;right:18px;top:18px;display:flex;gap:8px;z-index:3}.btn,.lang button{height:34px;border:1px solid rgba(216,180,93,.42);border-radius:9px;background:#06191ed9;color:#efd687;font-weight:900;font-size:11px;letter-spacing:.05em;text-decoration:none;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.lang{display:flex}.lang button{min-width:38px;padding:0;border-radius:0}.lang button:first-child{border-radius:9px 0 0 9px}.lang button:last-child{border-radius:0 9px 9px 0;border-left:0}.lang button.active{background:linear-gradient(#ead17e,#b8872f);color:#081216}
.panel{margin-top:18px;border:1px solid rgba(216,180,93,.38);border-radius:18px;background:linear-gradient(180deg,rgba(6,27,33,.97),rgba(3,14,19,.97));box-shadow:0 18px 44px #0005;overflow:hidden}.panel-head{padding:17px;border-bottom:1px solid rgba(216,180,93,.22);display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap}.panel h2{margin:0;color:#f5df9d;font:800 22px Georgia,serif}.panel p{margin:5px 0 0;color:#87a7a5;font-size:12px}.controls{display:flex;gap:10px;flex-wrap:wrap}.controls input,.controls select{height:38px;border:1px solid rgba(216,180,93,.28);border-radius:9px;background:#0a2228;color:#f5f8f8;padding:0 11px;outline:none;min-width:180px}.leaders{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;padding:14px 17px;border-bottom:1px solid rgba(216,180,93,.18)}.leader{padding:11px;border:1px solid rgba(216,180,93,.2);border-radius:11px;background:linear-gradient(180deg,rgba(12,46,52,.72),rgba(4,23,28,.72));min-height:90px}.leader strong{display:flex;align-items:center;gap:7px;color:#f1d780;font-size:12px}.leader img{width:20px;height:20px}.leader .value{font-size:22px;font-weight:900;margin-top:5px}.leader small{display:block;color:#87a8a5;line-height:1.35;margin-top:4px}.table-wrap{overflow:auto}.pets{width:100%;border-collapse:collapse;min-width:1040px}.pets th{position:sticky;top:0;background:#092229;color:#d7c37e;text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:10px;border-bottom:1px solid rgba(216,180,93,.25);cursor:pointer;white-space:nowrap}.pets td{padding:9px 10px;border-bottom:1px solid rgba(216,180,93,.11);font-size:12px}.pets tr:hover td{background:rgba(24,98,101,.12)}.petcell{display:flex;align-items:center;gap:10px;min-width:210px}.petcell img{width:43px;height:43px;border-radius:9px;object-fit:cover;border:1px solid rgba(216,180,93,.28);background:#06151a}.rank{color:#e8ca70;font-weight:900}.stat{font-variant-numeric:tabular-nums}.best{color:#ffe49a;font-weight:900;text-shadow:0 0 12px rgba(232,192,78,.18)}.high{color:#a9e1dc;font-weight:800}.empty{padding:30px;text-align:center;color:#8aa7a5}.foot{padding:12px 17px;color:#6f8d8b;font-size:11px;line-height:1.45}
@media(max-width:980px){.leaders{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.wrap{padding:12px}.hero{min-height:160px;padding-top:55px}.hero-actions{left:12px;right:12px;justify-content:space-between}.leaders{grid-template-columns:repeat(2,1fr)}.controls{width:100%}.controls input,.controls select{min-width:0;flex:1}.panel-head{align-items:stretch}}
</style></head><body><div class="wrap">
<section class="hero"><div class="hero-actions"><a class="btn" id="builderLink" href="/warpets">BUILDER</a><div class="lang"><button data-lang="en">EN</button><button data-lang="ru">RU</button></div></div><div><div class="hero-kicker">CALL OF DRAGONS</div><h1 id="heroTitle">TOP WAR PETS</h1><div class="hero-sub" id="heroSub">MAXIMUM ATTRIBUTES · SORTABLE RANKING</div></div></section>
<section class="panel"><div class="panel-head"><div><h2 id="tableTitle">Pets with the best attributes</h2><p id="tableDesc">The table uses maximum pet stats from the captured builder database. Click a stat header to rank by it.</p></div><div class="controls"><input id="search" placeholder="Search pet"><select id="unit"><option value="">All units</option></select><select id="sort"></select></div></div><div class="leaders" id="leaders"></div><div class="table-wrap"><table class="pets"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><div class="foot" id="foot"></div></section>
</div><script src="/warpets/top/pets-data.js"></script><script>
(()=>{const A=['Strength','Agility','Intelligence','Endurance','Spirit','Luck'];const D=window.WARPETS_DATA||[];const q=new URLSearchParams(location.search);let lang=(q.get('lang')||localStorage.getItem('warpet-language')||'en');if(!['ru','en'].includes(lang))lang='en';let sort='Strength',dir=-1;const T={en:{hero:'TOP WAR PETS',sub:'MAXIMUM ATTRIBUTES · SORTABLE RANKING',builder:'BUILDER',title:'Pets with the best attributes',desc:'The table uses maximum pet stats from the builder database. Click any stat header to rank by it.',search:'Search pet',all:'All units',rank:'Rank',pet:'Pet',type:'Type',unit:'Unit',total:'Total',foot:'Gold marks the maximum value for an attribute. Cyan marks the next high tier. Ranking recalculates when you sort or filter.',leaders:'Best',attrs:{Strength:'Strength',Agility:'Agility',Intelligence:'Intelligence',Endurance:'Endurance',Spirit:'Spirit',Luck:'Luck'}},ru:{hero:'ТОП ПИТОМЦЕВ',sub:'МАКСИМАЛЬНЫЕ ХАРАКТЕРИСТИКИ · СОРТИРУЕМЫЙ РЕЙТИНГ',builder:'БИЛДЕР',title:'Петы с лучшими характеристиками',desc:'Таблица использует максимальные характеристики петов из базы билдера. Нажмите на заголовок характеристики, чтобы построить топ по ней.',search:'Поиск пета',all:'Все типы войск',rank:'Место',pet:'Пет',type:'Тип',unit:'Войска',total:'Сумма',foot:'Золотым отмечен максимальный показатель характеристики. Бирюзовым — следующий высокий уровень. Рейтинг пересчитывается при сортировке и фильтрации.',leaders:'Лучшие',attrs:{Strength:'Сила',Agility:'Ловкость',Intelligence:'Интеллект',Endurance:'Выносливость',Spirit:'Дух',Luck:'Удача'}}};
const x=k=>T[lang][k];const max={};A.forEach(a=>max[a]=Math.max(...D.map(p=>p['max'+a])));const total=p=>A.reduce((n,a)=>n+Number(p['max'+a]||0),0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setup(){document.documentElement.lang=lang;document.getElementById('heroTitle').textContent=x('hero');document.getElementById('heroSub').textContent=x('sub');document.getElementById('builderLink').textContent=x('builder');document.getElementById('builderLink').href='/warpets?lang='+lang;document.getElementById('tableTitle').textContent=x('title');document.getElementById('tableDesc').textContent=x('desc');document.getElementById('search').placeholder=x('search');document.getElementById('foot').textContent=x('foot');document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));const unit=document.getElementById('unit'),val=unit.value;const units=[...new Set(D.map(p=>p.unit))].sort();unit.innerHTML='<option value="">'+x('all')+'</option>'+units.map(u=>'<option>'+esc(u)+'</option>').join('');unit.value=val;const sel=document.getElementById('sort'),sv=sel.value||sort;sel.innerHTML=A.map(a=>'<option value="'+a+'">'+x('attrs')[a]+'</option>').join('')+'<option value="Total">'+x('total')+'</option>';sel.value=sv;sort=sel.value;renderLeaders();render();}
function renderLeaders(){document.getElementById('leaders').innerHTML=A.map(a=>{const names=D.filter(p=>p['max'+a]===max[a]).map(p=>p.name).join(', ');return '<div class="leader"><strong><img src="/img/warpets/attributes/'+a+'.png" alt="">'+esc(x('attrs')[a])+'</strong><div class="value">'+max[a]+'</div><small>'+esc(names)+'</small></div>'}).join('')}
function render(){const needle=document.getElementById('search').value.trim().toLowerCase(),u=document.getElementById('unit').value;let rows=D.filter(p=>(!needle||p.name.toLowerCase().includes(needle))&&(!u||p.unit===u));rows.sort((a,b)=>{const av=sort==='Total'?total(a):a['max'+sort],bv=sort==='Total'?total(b):b['max'+sort];return (av-bv)*dir||a.name.localeCompare(b.name)});document.getElementById('thead').innerHTML='<tr><th>'+x('rank')+'</th><th>'+x('pet')+'</th><th>'+x('type')+'</th><th>'+x('unit')+'</th>'+A.map(a=>'<th data-sort="'+a+'">'+esc(x('attrs')[a])+(sort===a?(dir<0?' ↓':' ↑'):'')+'</th>').join('')+'<th data-sort="Total">'+x('total')+(sort==='Total'?(dir<0?' ↓':' ↑'):'')+'</th></tr>';document.getElementById('tbody').innerHTML=rows.length?rows.map((p,i)=>'<tr><td class="rank">#'+(i+1)+'</td><td><div class="petcell"><img src="/img/warpets/portrait/'+encodeURIComponent(p.name)+'.png" alt=""><b>'+esc(p.name)+'</b></div></td><td>'+esc(p.type)+'</td><td>'+esc(p.unit)+'</td>'+A.map(a=>{const v=p['max'+a],cl=v===max[a]?'best':v>=321?'high':'';return '<td class="stat '+cl+'">'+v+'</td>'}).join('')+'<td class="stat">'+total(p)+'</td></tr>').join(''):'<tr><td colspan="11" class="empty">—</td></tr>';document.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>{const n=th.dataset.sort;if(sort===n)dir*=-1;else{sort=n;dir=-1;document.getElementById('sort').value=n}render()})}
document.getElementById('search').addEventListener('input',render);document.getElementById('unit').addEventListener('change',render);document.getElementById('sort').addEventListener('change',e=>{sort=e.target.value;dir=-1;render()});document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('warpet-language',lang);const url=new URL(location.href);url.searchParams.set('lang',lang);history.replaceState(null,'',url);setup()});setup();})();
</script></body></html>
